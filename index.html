<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnatoRipasso</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --acc:#38bdf8; --ok:#22c55e; --ko:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 8px; font-size:1.5rem; }
  .sub { opacity:.8; margin-bottom:16px; }
  .stats { display:flex; gap:8px; margin-bottom:16px; }
  .stats div { background:var(--card); padding:10px; border-radius:12px; flex:1; text-align:center; }
  .big { font-size:1.4rem; font-weight:700; color:var(--acc); }
  .menu { display:grid; gap:10px; }
  .menu button { text-align:left; padding:16px; border-radius:14px; font-size:1.05rem; }
  .menu button small { display:block; opacity:.75; font-weight:400; margin-top:4px; }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back { padding:8px 12px; border-radius:10px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  button { font:inherit; border:0; border-radius:10px; padding:12px; cursor:pointer;
           background:var(--card); color:var(--txt); }
  button:hover { filter:brightness(1.2); }
  .tabs button { flex:1; }
  .tabs button.on { background:var(--acc); color:#0f172a; font-weight:600; }
  .box { background:var(--card); border-radius:14px; padding:20px; min-height:140px; }
  .tag { font-size:.75rem; color:var(--acc); margin-bottom:8px; }
  .q { font-size:1.15rem; margin-bottom:12px; }
  .a { color:var(--ok); margin-top:12px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { flex:1; }
  .opt { display:block; width:100%; margin-top:8px; text-align:left; }
  .good { background:var(--ok)!important; color:#0f172a; }
  .bad { background:var(--ko)!important; }
  select { background:var(--card); color:var(--txt); border:0; border-radius:8px; padding:6px; }
  .small { font-size:.8rem; opacity:.7; margin-top:12px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== HOME ===== -->
  <div id="home">
    <h1>AnatoRipasso</h1>
    <div class="sub">Ripassa anatomia con flashcard e quiz.</div>

    <div class="stats">
      <div>⭐ <span class="big" id="pts">0</span><br>Punti</div>
      <div>🏅 <span class="big" id="lvl">1</span><br>Livello</div>
      <div>📚 <span class="big" id="tot">0</span><br>Schede</div>
    </div>

    <div class="menu">
      <button id="m1">🃏 Flashcard<small>Ripasso con ripetizione spaziata</small></button>
      <button id="m2">🎯 Quiz<small>Risposta multipla a tempo libero</small></button>
    </div>
  </div>

  <!-- ===== ESERCIZI ===== -->
  <div id="esercizi" class="hidden">
    <div class="top">
      <button class="back" id="indietro">← Home</button>
      <h1 id="titolo">Flashcard</h1>
    </div>

    <div class="tabs">
      <button id="t1" class="on">Flashcard</button>
      <button id="t2">Quiz</button>
    </div>

    <div style="margin-bottom:10px">
      Argomento:
      <select id="argomento"><option value="">Tutti</option></select>

      Difficoltà:
      <select id="diff">
        <option value="0">Tutte</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option>
      </select>
    </div>

    <div class="box" id="box"></div>
    <div class="small">Materiale didattico: verificare sempre sul testo di riferimento.</div>
  </div>
</div>

<script>
// ====== LE SCHEDE SONO NEL FILE cards.json ======
let CARDS = [];

// ====== SALVATAGGIO NEL BROWSER ======
const KEY = "anatoripasso_v1";
let S = JSON.parse(localStorage.getItem(KEY) || "null") || {points:0, cards:{}};
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = id => document.getElementById(id);
const INTERVALS_MIN = [0, 1440, 2880, 5760, 11520, 23040];

function addPoints(n) { S.points += n; save(); stats(); }
function stats() {
  $("pts").textContent = S.points;
  $("lvl").textContent = Math.floor(S.points / 100) + 1;
  $("tot").textContent = CARDS.length;
}

// ====== RIPASSO E FILTRI ======
function filtered() {
  const d = +$("diff").value;
  const arg = $("argomento").value;
  return CARDS.filter(c =>
    (d === 0 || c.d === d) && (arg === "" || c.topic === arg)
  );
}
function pickDue() {
  const now = Date.now();
  const list = filtered();
  const due = list.filter(c => (S.cards[c.id]?.due || 0) <= now);
  const pool = due.length ? due : null;
  if (!pool) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}
function grade(card, ok) {
  const st = S.cards[card.id] || {box:0, due:0};
  st.box = ok ? Math.min(5, st.box + 1) : 0;
  st.due = Date.now() + INTERVALS_MIN[st.box] * 60000;
  S.cards[card.id] = st;
  addPoints(ok ? 5 * card.d : 1);
}

// ====== NAVIGAZIONE ======
function apriHome() {
  $("home").classList.remove("hidden");
  $("esercizi").classList.add("hidden");
}
function apriEsercizi(tipo) {
  mode = tipo;
  $("home").classList.add("hidden");
  $("esercizi").classList.remove("hidden");
  $("titolo").textContent = tipo === "flash" ? "Flashcard" : "Quiz";
  $("t1").className = tipo === "flash" ? "on" : "";
  $("t2").className = tipo === "quiz" ? "on" : "";
  render();
}

// ====== SCHERMATE ======
let mode = "flash";
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function aggiornaArgomenti() {
  const argomenti = [...new Set(CARDS.map(c => c.topic))].sort();
  const menu = $("argomento");
  menu.innerHTML = '<option value="">Tutti</option>';
  argomenti.forEach(a => {
    const o = document.createElement("option");
    o.value = a; o.textContent = a; menu.append(o);
  });
}

function showFlash() {
  const box = $("box"); box.innerHTML = "";
  const c = pickDue();
  if (!c) { box.append(el("div","q","🎉 Hai finito il ripasso per ora! Torna più tardi o prova il Quiz.")); return; }
  box.append(el("div","tag", c.topic + " · difficoltà " + c.d));
  box.append(el("div","q", c.q));
  const show = el("button", "", "Mostra risposta");
  show.onclick = () => {
    show.remove();
    box.append(el("div","a", c.a));
    const row = el("div","row");
    const ko = el("button","bad","❌ Non la sapevo");
    const ok = el("button","good","✅ La sapevo");
    ko.onclick = () => { grade(c,false); showFlash(); };
    ok.onclick = () => { grade(c,true); showFlash(); };
    row.append(ko, ok); box.append(row);
  };
  box.append(show);
}

function showQuiz() {
  const box = $("box"); box.innerHTML = "";
  const list = filtered();
  if (list.length < 1 || CARDS.length < 4) { box.append(el("div","q","Nessuna scheda disponibile per questo filtro.")); return; }
  const c = list[Math.floor(Math.random() * list.length)];
  const wrong = CARDS.filter(x => x.id !== c.id).sort(() => Math.random() - .5).slice(0,3);
  const opts = [c, ...wrong].sort(() => Math.random() - .5);
  box.append(el("div","tag", c.topic + " · difficoltà " + c.d));
  box.append(el("div","q", c.q));
  let done = false;
  opts.forEach(o => {
    const b = el("button","opt", o.a);
    b.onclick = () => {
      if (done) return; done = true;
      const ok = o.id === c.id;
      b.classList.add(ok ? "good" : "bad");
      if (!ok) [...box.querySelectorAll(".opt")].find(x => x.textContent === c.a).classList.add("good");
      addPoints(ok ? 10 * c.d : 0);
      const next = el("button","", "Prossima domanda ➡️");
      next.style.marginTop = "12px";
      next.onclick = showQuiz;
      box.append(next);
    };
    box.append(b);
  });
}

function render() { mode === "flash" ? showFlash() : showQuiz(); }

$("m1").onclick = () => apriEsercizi("flash");
$("m2").onclick = () => apriEsercizi("quiz");
$("indietro").onclick = apriHome;
$("t1").onclick = () => apriEsercizi("flash");
$("t2").onclick = () => apriEsercizi("quiz");
$("argomento").addEventListener("change", render);
$("diff").onchange = render;

// ====== CARICAMENTO DELLE SCHEDE ======
fetch("cards.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => {
    CARDS = d;
    aggiornaArgomenti();
    stats();
    render();
  })
  .catch(() => { $("box").textContent = "Errore nel caricamento delle schede."; });
</script>
</body>
</html>
